# Flux Bootstrap Secrets
k3s_flux_bootstrap_github_token: "{{
  lookup('community.general.onepassword', 'GitHub_Flux_Token',
  vault='infra-bootstrap-tools', field='password')
  }}"
k3s_flux_bootstrap_1password_service_account_token: "{{
  lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN') |
  default(lookup('community.general.onepassword',
                 'EXTERNAL_SECRETS_ONEPASSWORD_SERVICE_ACCOUNT',
                 vault='infra-bootstrap-tools',
                 field='credential',
                 default=''), true)
  }}"
