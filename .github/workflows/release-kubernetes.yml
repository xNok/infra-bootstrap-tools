name: Release Kubernetes Components

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
        description: 'The tag that triggered the release'
      package_dir:
        required: true
        type: string
        description: 'The directory of the package (e.g. kubernetes)'
      package_name:
        required: true
        type: string
        description: 'The name of the package (e.g. kubernetes-infra-addons)'

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: IBT_SKIP_SHELL_SETUP=1 nix develop .#flux --command bash -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Artifact
        run: ./bin/ci/release-kubernetes.sh "${{ github.repository_owner }}" "${{ inputs.release_tag }}" "${{ inputs.package_dir }}" "${{ github.event.repository.html_url }}"
