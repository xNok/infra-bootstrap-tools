name: Release Kubernetes Components

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
        description: 'The tag that triggered the release'
      package_dir:
        required: true
        type: string
        description: 'The directory of the package (e.g. kubernetes)'
      package_name:
        required: true
        type: string
        description: 'The name of the package (e.g. kubernetes-infra-addons)'

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop .#flux --command bash -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8


      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Artifact
        run: ./bin/ci/release-kubernetes.sh "${{ github.repository_owner }}" "${{ inputs.release_tag }}" "${{ inputs.package_dir }}" "${{ github.event.repository.html_url }}"
