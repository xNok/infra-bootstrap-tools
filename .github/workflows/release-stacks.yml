name: Package and Release Stacks

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., stacks@1.0.3)'
        required: true
        type: string
      stacks_dir:
        description: 'Directory containing stacks to zip'
        default: 'stacks'
        type: string
      dry_run:
        description: 'Run build without publishing'
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., infra-bootstrap-tools-stacks@1.0.3)'
        required: true
        type: string
      stacks_dir:
        description: 'Directory containing stacks to zip'
        default: 'stacks'
        type: string
      dry_run:
        description: 'Run build without publishing'
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  package-and-release:
    name: Package Stacks and Upload to Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop .#default --command bash -eo pipefail {0}
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.release.tag_name, '@')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.event.inputs.release_tag }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.event.inputs.release_tag }}
        run: ./bin/ci/lib/extract-version.sh

      - name: Create stack archives
        env:
          DIR: ${{ inputs.stacks_dir || github.event.inputs.stacks_dir || 'stacks' }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: ./bin/ci/package-stacks.sh "$DIR" "$VERSION" "$DIST_DIR"

      - name: Upload archives to release
        if: ${{ !(inputs.dry_run || github.event.inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: ./bin/ci/upload-stacks-release.sh "$TAG" "$DIST_DIR"
