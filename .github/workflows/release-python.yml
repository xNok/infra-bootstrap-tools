name: Publish Python Package

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., package@1.0.0)'
        required: true
        type: string
      package_dir:
        description: 'Directory containing the python package'
        default: 'agentic'
        type: string
      package_name:
        description: 'Name of the package in pyproject.toml to override'
        default: 'infra-bootstrap-tools-agentic'
        type: string
      dry_run:
        description: 'Run build without publishing'
        default: false
        type: boolean
    secrets:
      PYPI_API_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., infra-bootstrap-tools-agentic@0.1.1)'
        required: true
        type: string
      package_dir:
        description: 'Directory containing the python package'
        default: 'agentic'
        type: string
      package_name:
        description: 'Name of the package in pyproject.toml to override'
        default: 'infra-bootstrap-tools-agentic'
        type: string
      dry_run:
        description: 'Run build without publishing'
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop .#default --command bash -eo pipefail {0}
    # Run if it's workflow_call or manual dispatch. If release, run if the tag contains @ (Changesets workspace style).
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.release.tag_name, '@')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.event.inputs.release_tag }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.event.inputs.release_tag }}
        run: ./bin/ci/lib/extract-version.sh



      - name: Update version in pyproject.toml
        run: ./bin/ci/update-pyproject-version.sh "${{ inputs.package_dir || github.event.inputs.package_dir || 'agentic' }}" "${{ inputs.package_name || github.event.inputs.package_name || 'infra-bootstrap-tools-agentic' }}" "${{ steps.version.outputs.version }}"

      - name: Build package
        run: ./bin/ci/build-python-package.sh "${{ inputs.package_dir || github.event.inputs.package_dir || 'agentic' }}"

      - name: Upload package to release
        if: ${{ !(inputs.dry_run || github.event.inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/ci/upload-python-package.sh "${{ inputs.package_dir || github.event.inputs.package_dir || 'agentic' }}" "${{ steps.version.outputs.tag }}"
