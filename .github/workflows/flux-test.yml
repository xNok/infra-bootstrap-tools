name: "Test Flux Bootstrap"

on:
  pull_request:
    paths:
      - "kubernetes/**"
      - "bin/tests/flux-d2/test.sh"
      - "bin/k8s/setup-kind-local-registry.sh"
      - "bin/kind/config/**"
      - ".github/workflows/flux-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#flux --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kind
          registry: true


      - name: Run Test Script
        env:
          CLUSTER_NAME: kind
          FLEET_NAME: kind
          SOURCE_URL: ${{ github.event.repository.html_url }}
          REVISION: ${{ github.sha }}
        run: ./bin/ci/run-flux-test.sh
