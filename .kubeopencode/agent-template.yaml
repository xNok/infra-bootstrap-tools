apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: infra-bootstrap-base
  namespace: tenant-infra-bootstrap-tools
  labels:
    app.kubernetes.io/part-of: infra-bootstrap-tools
    app.kubernetes.io/component: agent-template
spec:
  # OpenCode container images
  agentImage: ghcr.io/kubeopencode/kubeopencode-agent-opencode:latest
  executorImage: ghcr.io/kubeopencode/kubeopencode-agent-devbox:latest
  attachImage: ghcr.io/kubeopencode/kubeopencode-agent-attach:latest

  workspaceDir: /workspace
  serviceAccountName: kubeopencode-agent

  # Git context with auto-sync: mounts repository at /workspace
  contexts:
    - name: repository
      type: Git
      git:
        repository: https://github.com/xNok/infra-bootstrap-tools.git
        ref: main
        sync:
          enabled: true
          interval: 5m
          policy: HotReload
      mountPath: .

  # OpenCode LLM configuration routed through OpenCode AI Gateway
  config:
    $schema: https://opencode.ai/config.json
    model: google/gemini-flash-lite-latest
    small_model: google/gemini-flash-lite-latest
    provider:
      google:
        options:
          baseURL: "https://opencode.ai/inference/custom/conn_01M6YV88K9TD9M17A40KCF15SZ"
          apiKey: "{env:OPENCODE_API_KEY}"
          headers:
            x-org-id: "org_01M6YR9ZMC4T85EEXGCF13SQPN"
            Authorization: "Bearer {env:OPENCODE_API_KEY}"

  # Concurrency limits and rate limiting
  maxConcurrentTasks: 3
  quota:
    maxTaskStarts: 20
    windowSeconds: 3600
