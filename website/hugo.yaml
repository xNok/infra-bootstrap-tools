theme: e25dx
enableGitInfo: true
enableRobotsTXT: true

baseURL: https://xnok.github.io/infra-bootstrap-tools
disableKinds: [ taxonomy, term ]

defaultContentLanguage: en

languages:
  en:
    weight: 1
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Infra Bootstrap Tools
    params:
      description: IaC configurations to boostrap and manage a small self-hosted project or homelab

services:
  googleAnalytics:
    ID: G-1368982DJ1 # To omit, put a ~ here

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  tableOfContents:
    pre: <nav id="TableOfContents" aria-label="Table of Contents">
    post: </nav>

params:
  project:
    startYear: 2022  # To omit, put a ~ here
    presentYear: 2025
    repo:
      main: xNok/infra-bootstrap-tools
    themeColor:
      light: '#ffffff'
      dark: '#101010'

  author:
    name: xNok
    url: https://github.com/username/xNok

  pagination:
    size: 6

  og_image: infra-bootstrap-tools.webp
  enableOGXSEO: true # No automated OG image generation
  enablePageFind: true # Run pagefind --site dir after build

  services:
    umami: ~ # To omit, put a ~ here & remove id, scriptPath lines
#      id: xxx
#      scriptPath: https://cloud.umami.is/script.js

  home:
    heading: Learn
    headingSegment2: Infrastructure-as-Code
    description: For Small self-hosted project or Homelab
    getStartedPath: /docs

#  social:
#    twitter: AlexCouedelo

menus:
  main:
    - identifier: home
      name: Home
      pageRef: /
      weight: 1
      params:
        icon: home
    - identifier: docs
      name: Documentation
      pageRef: /docs
      weight: 2
      params:
        icon: menu_book
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 3
      params:
        icon: news
