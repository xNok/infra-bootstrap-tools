apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: digitalocean-dns
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: digitalocean-dns
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: DigitalOcean
        property: credential
