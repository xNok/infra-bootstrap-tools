apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-addons
  namespace: flux-system
spec:
  interval: 1h
  prune: true

  sourceRef:
    kind: OCIRepository
    name: infra-addons
  path: "./base"

  # components are relative to the source root (infra-addons OCI root)
  components:
    - ../components/cert-manager
    - ../components/openziti
    - ../components/openziti-config

  # Substitute cluster-specific values (e.g. CLUSTER_NAME) into the manifests before applying.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
      - kind: ConfigMap
        name: cluster-env
        optional: true

  patches:
    - patch: |
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: openziti-ziti-controller-web-identity-cert
          namespace: openziti
        spec:
          ipAddresses:
            - 127.0.0.1
            - "::1"
            - ${ROUTER_ADVERTISED_HOST}
      target:
        kind: Certificate
        name: openziti-ziti-controller-web-identity-cert
