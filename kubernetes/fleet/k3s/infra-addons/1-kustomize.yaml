apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-addons
  namespace: flux-system
spec:
  interval: 1h
  prune: true

  sourceRef:
    kind: OCIRepository
    name: infra-addons
  path: "./base"

  # components are relative to the source root (infra-addons OCI root)
  components:
    - ../components/cert-manager
    - ../components/openziti

  # Substitute cluster-specific values (e.g. CLUSTER_NAME) into the manifests before applying.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
      - kind: ConfigMap
        name: cluster-env

  patches:
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ziti-controller
          namespace: flux-system
        spec:
          values:
            clientApi:
              advertisedHost: ${ROUTER_ADVERTISED_HOST}
              advertisedPort: 1280
              service:
                type: LoadBalancer
          postRenderers:
            - kustomize:
                patches:
                  - patch: |
                      - op: add
                        path: /spec/ipAddresses
                        value:
                          - 127.0.0.1
                          - "::1"
                          - ${ROUTER_ADVERTISED_HOST}
                    target:
                      kind: Certificate
                      name: openziti-ziti-controller-web-identity-cert
      target:
        kind: HelmRelease
        name: ziti-controller
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: ziti-router
          namespace: flux-system
        spec:
          values:
            edge:
              advertisedHost: ${ROUTER_ADVERTISED_HOST}
              advertisedPort: 8442
              service:
                type: LoadBalancer
            ctrl:
              endpoint: "openziti-ziti-controller-client.openziti.svc.cluster.local:1280"
            csr:
              sans:
                ip:
                  - ${ROUTER_ADVERTISED_HOST}
            enrollmentJwtFromSecret: true
            enrollmentJwtSecretName: "ziti-router-enrollment"
      target:
        kind: HelmRelease
        name: ziti-router
