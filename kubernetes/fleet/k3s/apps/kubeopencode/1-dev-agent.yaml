apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubeopencode-dev-agent
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: kubeopencode-controller
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: "./apps/kubeopencode/1-dev-agent"
