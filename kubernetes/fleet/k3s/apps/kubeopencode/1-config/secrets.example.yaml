# Example Secret manifest for LLM API keys and Git credentials
# Copy to secrets.yaml or manage via external-secrets / sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: ai-credentials
  namespace: kubeopencode-apps
type: Opaque
stringData:
  # Anthropic Claude
  ANTHROPIC_API_KEY: "sk-ant-your-key-here"
  # Google Gemini
  GEMINI_API_KEY: "your-gemini-key-here"
  # OpenAI
  OPENAI_API_KEY: "sk-your-openai-key-here"
---
# Example Secret manifest for private Git repository access
apiVersion: v1
kind: Secret
metadata:
  name: github-git-credentials
  namespace: kubeopencode-apps
type: Opaque
stringData:
  username: "x-access-token"
  password: "ghp_yourPersonalAccessTokenHere"
