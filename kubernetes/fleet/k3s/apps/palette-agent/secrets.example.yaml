# Secret scaffolding for palette-agent
#
# Create this secret in the 'agentic-workflows' namespace on your K3s cluster:
#   kubectl apply -f secrets.yaml
#
---
apiVersion: v1
kind: Secret
metadata:
  name: github-token-creds
  namespace: agentic-workflows
type: Opaque
stringData:
  # GitHub PAT or App installation token with write access to mekitmedia/cncf-landscape-a-to-z
  GITHUB_TOKEN: "ghp_replace_with_github_token"
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-creds
  namespace: agentic-workflows
type: Opaque
stringData:
  # Anthropic API key for Claude 3.7 Sonnet
  ANTHROPIC_API_KEY: "sk-ant-replace_with_anthropic_api_key"
