apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: palette-agent-instance
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/palette-agent/1-instance
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  targetNamespace: agentic-workflows
  dependsOn:
    - name: palette-agent-catalogue
  timeout: 5m
  wait: true
