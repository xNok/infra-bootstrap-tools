apiVersion: v1
kind: Namespace
metadata:
  name: agentic-workflows
  labels:
    app.kubernetes.io/name: kubeopencode
    app.kubernetes.io/part-of: agentic-workflows
---
apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: palette-agent
  namespace: agentic-workflows
  labels:
    app.kubernetes.io/name: kubeopencode
    app.kubernetes.io/component: agent
spec:
  # Inherits images, context repo, and credentials contract from catalogue template
  templateRef:
    name: palette-agent-template
  profile: "Palette UX & Accessibility Agent for CNCF Landscape"
  # Auto-suspends after 15m idle to preserve K3s cluster RAM and CPU
  standby:
    idleTimeout: 15m
