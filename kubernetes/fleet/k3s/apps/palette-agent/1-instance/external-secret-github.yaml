apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-creds
  namespace: agentic-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-token-creds
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: KUBEOPENCODE_GITHUB_PAT/password
