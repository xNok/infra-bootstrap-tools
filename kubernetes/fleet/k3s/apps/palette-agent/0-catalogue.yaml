apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: palette-agent-catalogue
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubeopencode-agents/palette-agent
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: apps
  targetNamespace: agentic-workflows
  dependsOn:
    - name: kubeopencode-controller
  timeout: 5m
  wait: true
