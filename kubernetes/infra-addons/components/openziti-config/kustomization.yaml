apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - router-enrollment-job.yaml
  - ext-jwt-signer-job.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

configMapGenerator:
  - name: ziti-router-enroll-script
    namespace: openziti
    files:
      - enroll-router.sh=scripts/enroll-router.sh
  - name: ziti-ext-jwt-script
    namespace: openziti
    files:
      - configure-ext-jwt.sh=scripts/configure-ext-jwt.sh
