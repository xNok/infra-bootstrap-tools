apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - namespace.yaml
  - helm-repo.yaml
  - external-dns.yaml
  - external-secret.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: default-external-dns-values
    namespace: flux-system
    files:
      - values.yaml=values/default-external-dns.values.yaml
