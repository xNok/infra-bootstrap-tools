apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: ">=1.14.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: default-external-dns-values
    - kind: ConfigMap
      name: ${CLUSTER_NAME}-external-dns-values
      optional: true
