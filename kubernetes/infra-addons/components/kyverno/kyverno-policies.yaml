apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  targetNamespace: kyverno
  dependsOn:
    - name: kyverno
      namespace: flux-system
  chart:
    spec:
      chart: kyverno-policies
      version: "3.9.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: default-kyverno-policies-values
    - kind: ConfigMap
      name: ${CLUSTER_NAME}-kyverno-policies-values
      optional: true
