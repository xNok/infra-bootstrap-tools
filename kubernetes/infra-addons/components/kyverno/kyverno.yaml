apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  targetNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: "3.9.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: default-kyverno-values
    - kind: ConfigMap
      name: ${CLUSTER_NAME}-kyverno-values
      optional: true
