apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - namespace.yaml
  - helm-repo.yaml
  - external-secrets.yaml
  - cluster-secret-store.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: default-external-secrets-values
    namespace: flux-system
    files:
      - values.yaml=values/default-external-secrets.values.yaml
