apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: ">=0.14.0 <3.0.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: default-external-secrets-values
    - kind: ConfigMap
      name: ${CLUSTER_NAME}-external-secrets-values
      optional: true
