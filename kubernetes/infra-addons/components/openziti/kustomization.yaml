apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - namespace.yaml
  - controller.yaml
  - ziti-host.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: default-ziti-controller-values
    namespace: flux-system
    files:
      - values.yaml=values/default-ziti-controller.values.yaml
  - name: default-ziti-router-values
    namespace: flux-system
    files:
      - values.yaml=values/default-ziti-router.values.yaml
