apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-infra-bootstrap-tools-applier
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-infra-bootstrap-tools-applier-role
  namespace: tenant-infra-bootstrap-tools
rules:
  # Allow managing KubeOpenCode CRDs
  - apiGroups: ["kubeopencode.io"]
    resources:
      - agents
      - agenttemplates
      - crontasks
      - tasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow External Secrets Operator primitives
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["generators.external-secrets.io"]
    resources:
      - githubaccesstokens
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow NetworkPolicy
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow managing tenant-scoped RBAC (controller role/rolebinding)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow ConfigMaps, Secrets, ServiceAccounts
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-infra-bootstrap-tools-applier-binding
  namespace: tenant-infra-bootstrap-tools
subjects:
  - kind: ServiceAccount
    name: tenant-infra-bootstrap-tools-applier
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-infra-bootstrap-tools-applier-role
