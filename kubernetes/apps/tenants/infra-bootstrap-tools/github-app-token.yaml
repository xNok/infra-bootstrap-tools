apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-token-generator
  namespace: tenant-infra-bootstrap-tools
spec:
  appID: "${GITHUB_APP_ID}"
  installID: "${GITHUB_INSTALLATION_ID}"
  url: "https://api.github.com"
  auth:
    privateKey:
      secretRef:
        name: github-app-private-key
        key: private-key.pem
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-creds
  namespace: tenant-infra-bootstrap-tools
spec:
  refreshInterval: 50m
  target:
    name: github-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-token-generator
