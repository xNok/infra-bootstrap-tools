apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-workload-isolation
  annotations:
    policies.kyverno.io/title: Tenant Workload Isolation
    policies.kyverno.io/category: Multi-Tenancy & Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet, ReplicaSet, Kustomization
    policies.kyverno.io/description: >-
      Restricts tenant namespaces to KubeOpenCode agent resources only.
      Deployments, StatefulSets, DaemonSets, and ReplicaSets are strictly forbidden
      to prevent unauthorized workloads in tenant namespaces. Flux Kustomizations
      targeting tenant namespaces must specify a restricted tenant applier.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-unauthorized-workloads
      match:
        any:
          - resources:
              namespaces:
                - "tenant-*"
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - ReplicaSet
      validate:
        message: >-
          Tenant namespaces are strictly restricted to KubeOpenCode agent resources
          (Agent, AgentTemplate, CronTask, Task). Deployments, StatefulSets, and DaemonSets
          are forbidden.
        deny: {}
    - name: require-tenant-applier-service-account
      match:
        any:
          - resources:
              kinds:
                - Kustomization
      preconditions:
        all:
          - key: "{{ request.object.spec.targetNamespace }}"
            operator: Equals
            value: "tenant-*"
      validate:
        message: >-
          Flux Kustomizations targeting tenant namespaces must specify a restricted
          tenant applier serviceAccountName (e.g., tenant-*-applier).
        pattern:
          spec:
            serviceAccountName: "tenant-*-applier"
