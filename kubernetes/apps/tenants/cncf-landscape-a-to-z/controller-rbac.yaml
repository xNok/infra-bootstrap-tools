# Namespaced least-privilege RBAC for the KubeOpenCode Controller
# Grants the controller permissions ONLY within this tenant namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeopencode-controller-tenant-role
  namespace: tenant-cncf-landscape
rules:
  # Manage KubeOpenCode custom resources within this tenant namespace
  - apiGroups: ["kubeopencode.io"]
    resources:
      - agents
      - agents/status
      - agents/finalizers
      - agenttemplates
      - crontasks
      - tasks
      - tasks/status
      - tasks/finalizers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage workload Pods and Jobs generated for tasks
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - pods/status
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeopencode-controller-tenant-binding
  namespace: tenant-cncf-landscape
subjects:
  - kind: ServiceAccount
    name: kubeopencode-controller
    namespace: kubeopencode-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeopencode-controller-tenant-role
