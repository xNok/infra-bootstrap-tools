apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: cncf-landscape-base
spec:
  # Credentials injected centrally by infra-bootstrap-tools (Single Router Key pattern)
  credentials:
    - name: github-token
      secretRef:
        name: github-creds
        key: token
      env: GITHUB_TOKEN
    - name: opencode-go-api-key
      secretRef:
        name: opencode-go-creds
        key: api-key
      env: OPENCODE_API_KEY

  # OpenCode configuration routed through OpenCode AI Gateway
  config:
    provider:
      google:
        options:
          baseURL: "https://opencode.ai/inference/custom/conn_01M6YV88K9TD9M17A40KCF15SZ"
          apiKey: "{env:OPENCODE_API_KEY}"
          headers:
            x-org-id: "org_01M6YR9ZMC4T85EEXGCF13SQPN"
            Authorization: "Bearer {env:OPENCODE_API_KEY}"

  # Pod specifications, Git bot committer identity, and security hardening
  podSpec:
    extraEnv:
      - name: GIT_AUTHOR_NAME
        value: "xnok-kubeopencode[bot]"
      - name: GIT_AUTHOR_EMAIL
        value: "5866072+xnok-kubeopencode[bot]@users.noreply.github.com"
      - name: GIT_COMMITTER_NAME
        value: "xnok-kubeopencode[bot]"
      - name: GIT_COMMITTER_EMAIL
        value: "5866072+xnok-kubeopencode[bot]@users.noreply.github.com"
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
