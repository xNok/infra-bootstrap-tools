apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: cncf-landscape-base
spec:
  # Credentials injected centrally by infra-bootstrap-tools
  credentials:
    - name: github-token
      secretRef:
        name: github-creds
        key: token
      env: GITHUB_TOKEN
    - name: google-api-key
      secretRef:
        name: google-creds
        key: api-key
      env: GOOGLE_API_KEY
    - name: google-genai-api-key
      secretRef:
        name: google-creds
        key: api-key
      env: GOOGLE_GENERATIVE_AI_API_KEY
    - name: opencode-go-api-key
      secretRef:
        name: opencode-go-creds
        key: api-key
      env: OPENCODE_API_KEY

  # Pod specifications, Git bot committer identity, and security hardening
  podSpec:
    extraEnv:
      - name: GIT_AUTHOR_NAME
        value: "xnok-kubeopencode[bot]"
      - name: GIT_AUTHOR_EMAIL
        value: "5866072+xnok-kubeopencode[bot]@users.noreply.github.com"
      - name: GIT_COMMITTER_NAME
        value: "xnok-kubeopencode[bot]"
      - name: GIT_COMMITTER_EMAIL
        value: "5866072+xnok-kubeopencode[bot]@users.noreply.github.com"
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
