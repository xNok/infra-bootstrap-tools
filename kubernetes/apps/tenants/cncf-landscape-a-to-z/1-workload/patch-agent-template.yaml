apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: cncf-landscape-base
  namespace: tenant-cncf-landscape
spec:
  # Credentials injected centrally by infra-bootstrap-tools
  credentials:
    - name: github-token
      secretRef:
        name: github-creds
        key: token
      env: GITHUB_TOKEN
    - name: google-api-key
      secretRef:
        name: google-creds
        key: api-key
      env: GOOGLE_API_KEY

  # Pod specifications, Git bot committer identity, and security hardening
  podSpec:
    env:
      - name: GIT_AUTHOR_NAME
        value: "cncf-landscape-agent[bot]"
      - name: GIT_AUTHOR_EMAIL
        value: "123456+cncf-landscape-agent[bot]@users.noreply.github.com"
      - name: GIT_COMMITTER_NAME
        value: "cncf-landscape-agent[bot]"
      - name: GIT_COMMITTER_EMAIL
        value: "123456+cncf-landscape-agent[bot]@users.noreply.github.com"
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
