apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-cncf-landscape-applier
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-cncf-landscape-applier-role
  namespace: tenant-cncf-landscape
rules:
  # Allow managing KubeOpenCode CRDs
  - apiGroups: ["kubeopencode.io"]
    resources:
      - agents
      - agenttemplates
      - crontasks
      - tasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow ConfigMaps for non-sensitive agent configuration
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-cncf-landscape-applier-binding
  namespace: tenant-cncf-landscape
subjects:
  - kind: ServiceAccount
    name: tenant-cncf-landscape-applier
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-cncf-landscape-applier-role
