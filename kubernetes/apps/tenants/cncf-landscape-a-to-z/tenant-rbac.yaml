apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-tenant-sa
  namespace: tenant-cncf-landscape
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-tenant-role
  namespace: tenant-cncf-landscape
rules:
  # Only allow managing KubeOpenCode Custom Resources
  - apiGroups: ["kubeopencode.io"]
    resources:
      - agents
      - agenttemplates
      - crontasks
      - tasks
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow ConfigMaps within the tenant namespace for configurations
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow read-only access to secrets in the tenant namespace (for credentials)
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-tenant-rolebinding
  namespace: tenant-cncf-landscape
subjects:
  - kind: ServiceAccount
    name: flux-tenant-sa
    namespace: tenant-cncf-landscape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-tenant-role
