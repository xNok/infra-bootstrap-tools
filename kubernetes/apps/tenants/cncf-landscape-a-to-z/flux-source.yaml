apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cncf-landscape-agent-source
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/mekitmedia/cncf-landscape-a-to-z.git
  ref:
    branch: main
  ignore: |
    # Ignore everything except the k8s manifests
    /*
    !/k8s/kubeopencode
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cncf-landscape-agent-manifests
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: cncf-landscape-agent-source
    namespace: flux-system
  path: "./k8s/kubeopencode"
  prune: true
  wait: true
  targetNamespace: tenant-cncf-landscape
  # Enforce tenant isolation by running with the restricted ServiceAccount
  serviceAccountName: flux-tenant-sa
  # Central overlay: injects credentials, bot Git identity, and security specs
  patches:
    - patch: |
        apiVersion: kubeopencode.io/v1alpha1
        kind: AgentTemplate
        metadata:
          name: cncf-landscape-base
        spec:
          credentials:
            - name: github-token
              secretRef:
                name: github-creds
                key: token
              env: GITHUB_TOKEN
            - name: google-api-key
              secretRef:
                name: google-creds
                key: api-key
              env: GOOGLE_API_KEY
          podSpec:
            env:
              - name: GIT_AUTHOR_NAME
                value: "cncf-landscape-agent[bot]"
              - name: GIT_AUTHOR_EMAIL
                value: "123456+cncf-landscape-agent[bot]@users.noreply.github.com"
              - name: GIT_COMMITTER_NAME
                value: "cncf-landscape-agent[bot]"
              - name: GIT_COMMITTER_EMAIL
                value: "123456+cncf-landscape-agent[bot]@users.noreply.github.com"
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
      target:
        kind: AgentTemplate
        name: cncf-landscape-base
