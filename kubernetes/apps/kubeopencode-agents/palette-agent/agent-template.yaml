apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: palette-agent-template
  labels:
    app.kubernetes.io/name: kubeopencode
    app.kubernetes.io/component: agent-template
spec:
  # OpenCode runtime binary (init container) + devbox worker container
  agentImage: quay.io/kubeopencode/kubeopencode-agent-opencode:latest
  executorImage: quay.io/kubeopencode/kubeopencode-agent-devbox:latest
  workspaceDir: /workspace
  serviceAccountName: palette-agent-sa
  podSpec:
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
  # Target Repository Context: clones target repo into the workspace
  contexts:
    - name: cncf-landscape
      description: "Target repository: CNCF Landscape A-Z"
      type: Git
      git:
        repository: https://github.com/mekitmedia/cncf-landscape-a-to-z.git
        ref: main
        sync:
          enabled: true
          interval: 10m
          policy: HotReload
      mountPath: .
  # Credential Contracts: mounted secrets for Git operations and LLM access
  credentials:
    - name: github
      secretRef:
        name: github-token-creds
    - name: llm
      secretRef:
        name: llm-api-creds
  # Default LLM Configuration
  config:
    model: google/gemini-flash-lite-latest
    share: disabled
    autoupdate: false


